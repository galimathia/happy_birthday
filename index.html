<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Задаём заголовок вкладки страницы -->
    <title>Поздравляю!</title>
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Контейнер для декоративных падающих элементов -->
    <div class="sparkles" aria-hidden="true">
      <!-- Каждый span будет служить отдельным падающим элементом -->
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Основной контейнер страницы -->
    <main class="container">
      <!-- Центральальный блок с поздравлением -->
      <section class="card">
        <!-- Само поздравление, которое увидит пользователь при открытии страницы -->
        <h1>С днём рождения!</h1>

        <!-- Фотография, которая будет отображаться на странице -->
        <img
          class="birthday-photo"
          src="assets/photo_2026-07-24_17-25-29.jpg"
          alt="Пес поздравляет вас"
        />
      </section>
    </main>
  </body>
</html>
