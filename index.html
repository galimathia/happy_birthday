<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Задаём заголовок вкладки страницы -->
    <title>Поздравляю!</title>
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Контейнер для декоративных падающих элементов -->
    <div class="sparkles" aria-hidden="true"></div>

    <!-- Основной контейнер страницы -->
    <main class="container">
      <!-- Центральальный блок с поздравлением -->
      <section class="card">
        <!-- Само поздравление, которое увидит пользователь при открытии страницы -->
        <h1>С днём рождения!</h1>

        <!-- Отдельный блок с фотографией -->
        <figure class="photo-card">
          <img
            class="birthday-photo"
            src="assets/photo_2026-07-24_17-25-29.jpg"
            alt="Пес поздравляет вас"
          />
        </figure>
      </section>
    </main>
  </body>
</html>
